<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="icon" type="image/png" href="../assets/images/icono.png">
    <script src="../js/main.js" defer></script>
    <script src="https://kit.fontawesome.com/dc94cdf766.js" crossorigin="anonymous"></script>
  </head>
  <body class="login-body">
    <main class="login-main">
      <figure>
        <img src="../assets/images/Logo.png" alt="Logo de Quantum Arcade" />
      </figure>

      <section class="container-form">
        <h2>Log in</h2>
        <form action="">
          <div class="container-input">
          <label for="email">Mail</label>
            <div class="input-with-icon">
            <span class="material-symbols-outlined icon">person</span>
            <input
              id="email"
              type="email"
              placeholder="titocalderon@gmail.com"
              required
            />
            </div>
          </div>
          <div class="container-input">
          <label for="password">Password</label>
            <div class="input-with-icon">
            <span class="material-symbols-outlined icon">lock</span>
            <input
              id="password"
              type="password"
              placeholder="********"
              required
            />
            <span class="material-symbols-outlined icon toggle-password"
              >visibility</span
            >
            <span class="material-symbols-outlined icon toggle-password"
              >visibility_off</span
            >
            </div>
          </div>

          <button class="btn-signup" type="button"><span>Iniciar sesión</span></button>

          <label class="check">
            <input type="checkbox">
            <span></span>
            Mantener sesión iniciada
          </label>
        </form>

        <p>
          ¿No estás registrado?
          <a href="../index.html">Regístrate aquí</a>
        </p>
        <p>O</p>
        <p>Iniciar sesión con:</p>
        <!-- Icono de Google y Facebook -->
        <div class="social-icons">
          <i class="fa-brands fa-google"></i>
          <i class="fa-brands fa-facebook"></i>
        </div>
      </section>
    </main>
  </body>
</html>
