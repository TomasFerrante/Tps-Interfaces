<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Arcade</title>
    <link rel="stylesheet" href="/Tps-Interfaces/css/styles.css" />
    
    <!-- Poner icono -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/dc94cdf766.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="/Tps-Interfaces/assets/images/icono.png">
  </head>
  
  <body class="body-bg">
    <main>
      <figure>
        <img src="/Tps-Interfaces/assets/images/Logo.png" alt="Logo de Quantum Arcade" />
      </figure>

      <section class="container-form">
        <h2>Sign up</h2>
        <form action="/Tps-Interfaces/html/home.html" class="form-signup">
          <div class="container-input">
            <label for="name">Nombre/s y apellido/s *</label>
            <div class="input-with-icon">
              <span class="icon material-symbols-outlined">person</span>
              <input id="name" type="text" placeholder="Tito Calderon" required />
            </div>
            <p class="helper-text">Helper text</p>
          </div>

          <div class="container-input">
            <label for="nickname">Nickname</label>
            <div class="input-with-icon">
              <span class="icon material-symbols-outlined">person</span>
              <input id="nickname" type="text" placeholder="titocalderon23" />
            </div>
            <p class="helper-text">Helper text</p>
          </div>

          <div class="container-input">
            <label for="age">Edad *</label>
            <div class="input-with-icon">
              <span class="icon material-symbols-outlined">person</span>
              <input id="age" type="number" min="0" max="110" placeholder="18" required />
            </div>
            <p class="helper-text">Helper text</p>
          </div>

          <div class="container-input">
            <label for="email">Mail *</label>
            <div class="input-with-icon">
              <span class="icon material-symbols-outlined">person</span>
              <input id="email" type="email" placeholder="titocalderon@gmail.com" required />
            </div> 
            <p class="helper-text">Helper text</p>
          </div>

          <div class="container-input">
            <label for="password">Contraseña *</label>
            <div class="input-with-icon">
              <span class="icon material-symbols-outlined">lock</span>
              <input id="password" type="password" placeholder="********" required />
              <span class="material-symbols-outlined icon toggle-password">visibility</span>
              <span class="material-symbols-outlined icon toggle-password">visibility_off</span>
            </div>
            <p class="helper-text">Helper text</p>
          </div>

          <div class="container-input">
            <label for="confirm-password">Confirmar contraseña *</label>
              <div class="input-with-icon">
                <span class="icon material-symbols-outlined">lock</span>
                <input id="confirm-password" type="password" placeholder="********" required />
                <span class="material-symbols-outlined icon toggle-password">visibility</span>
                <span class="material-symbols-outlined icon toggle-password">visibility_off</span>
              </div> 
              <p class="helper-text">Helper text</p>
          </div>

          <!-- Captcha -->
          <div class="captcha-container">
            <div class="captcha-box">
              <canvas id="captchaCanvas" width="200" height="60"></canvas>
              <button type="button" class="captcha-refresh" id="refreshCaptcha">
                <span class="material-symbols-outlined">refresh</span>
              </button>
            </div>
            <div class="container-input captcha-input">
              <label for="captcha-input">Ingresa el código *</label>
              <div class="input-with-icon">
                <span class="icon material-symbols-outlined">security</span>
                <input id="captcha-input" type="text" placeholder="Código del captcha" required autocomplete="off" />
              </div>
              <p class="helper-text captcha-helper">Helper text</p>
            </div>
          </div>

          <button class="btn-signup" type="submit"><span>Registrarse</span></button>
        </form>

        <p>Ya estás registrado?
          <a href="/Tps-Interfaces/html/login.html">Iniciar sesión aquí</a>
        </p>
        <p>O</p>
        <p>Iniciar sesión con:</p>
        <div class="social-icons">
          <i class="fa-brands fa-google"></i>
          <i class="fa-brands fa-facebook"></i>
        </div> 
      </section>
    </main>
  <script src="/Tps-Interfaces/js/main.js" defer></script>
  <script src="/Tps-Interfaces/js/authForms.js" defer></script>
  </body>
</html>
