<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Arcade</title>
    <link rel="stylesheet" href="../styles.css" />
    <script src="../script.js" defer></script>
    <!-- Poner icono -->
  </head>
  
  <body>
    <main>
      <section>
        <figure></figure>
      </section>

      <section>
        <h2>Sign up</h2>
        <form action="">
          <label for="name">
            Nombre/s y apellido/s
          </label>
          <input id="name" type="text" placeholder="Tito Calderon" required />
          
          <label for="nickname">Nickname</label>

          <input id="nickname" type="text" placeholder="titocalderon23" />

          <label for="age">Edad</label>
          <input id="age" type="number" placeholder="18" required />

          <label for="email">Mail</label>
          <input id="email" type="email" placeholder="titocalderon@gmail.com" required />

          <label for="password">Password</label>
          <input type="password" placeholder="********" required />

          <label for="confirm-password">Confirm Password</label>
          <input id="confirm-password" type="password" placeholder="********" required />

          <!-- Imagen de captcha? -->
          <button type="button">Registrarse</button>
        </form>

        <p>Ya estás registrado? 
          <a href="./html/login.html">Iniciar sesión aquí</a>
        </p>
        <p>O</p>
        <p>Iniciar sesión con:</p>
        <!-- Icono de Google y Facebook -->
      </section>
    </main>
  </body>
</html>
